name: opsdesk-tests
services:
  postgres:
    image: postgres:18.6-bookworm@sha256:f1ea2a1a4fb7b68d4836be1fdcb8a6466a89b072158bf9d97663600538c294c5
    labels:
      opsdesk.owner: opsdesk-tests
    environment:
      POSTGRES_DB: opsdesk_lab_ci
      POSTGRES_USER: opsdesk_ci
      POSTGRES_HOST_AUTH_METHOD: trust
    ports: ["127.0.0.1:55436:5432"]
    tmpfs: ["/var/lib/postgresql:size=2147483648"]
    command: ["postgres", "-c", "max_wal_size=128MB", "-c", "min_wal_size=32MB", "-c", "checkpoint_timeout=30s"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opsdesk_ci -d opsdesk_lab_ci"]
      interval: 3s
      timeout: 3s
      retries: 30
    mem_limit: 3g
    shm_size: 128mb
