name: Checkpoint foundation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned uv
        run: python -m pip install uv==0.13.7
      - name: Verify lock and install full planned stack
        run: |
          uv lock --check
          uv sync --locked --extra stack
      - name: Lint and formatting
        run: |
          uv run --locked ruff check .
          uv run --locked ruff format --check .
      - name: Tests
        run: uv run --locked pytest
      - name: Package and stack import smoke check
        run: |
          uv run --locked python -c "import agent_reliability_lab, fastapi, langgraph, mcp, psycopg, streamlit"
          uv build
