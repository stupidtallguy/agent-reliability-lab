name: OpsDesk validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:f1ea2a1a4fb7b68d4836be1fdcb8a6466a89b072158bf9d97663600538c294c5
        env:
          POSTGRES_DB: opsdesk_lab_ci
          POSTGRES_USER: opsdesk_ci
          # Ephemeral CI database only; no stored password or production data.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opsdesk_ci -d opsdesk_lab_ci"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      UV_PYTHON: ${{ matrix.python-version }}
      OPSDESK_DATABASE_URL: postgresql+psycopg://opsdesk_ci@127.0.0.1:5432/opsdesk_lab_ci
      OPSDESK_ALLOW_SANDBOX: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned uv
        run: python -m pip install uv==0.13.7
      - name: Verify lock and install full planned stack
        run: |
          uv lock --check
          uv sync --locked --extra stack
          uv run --locked python -c "import sys; assert sys.version_info[:2] == tuple(map(int, '${{ matrix.python-version }}'.split('.'))); print(sys.version)"
      - name: Research CLI and historical source integrity
        run: |
          uv run --locked opsdesk-research --help
          uv run --locked opsdesk-research validate benchmarks/research/split-development.json
          uv run --locked opsdesk-research validate benchmarks/research/split-held_out.json
          uv run --locked opsdesk-research validate benchmarks/research/dataset-release.json
      - name: Lint and formatting
        run: |
          uv run --locked ruff check .
          uv run --locked ruff format --check .
      - name: Unit and in-memory MCP protocol tests (no PostgreSQL required)
        run: uv run --locked pytest -m 'not integration'
      - name: PostgreSQL, MCP, agent restart, evaluation and adversarial tests
        run: uv run --locked pytest -m integration
      - name: Isolated trusted MCP demonstration
        run: uv run --locked opsdesk-mcp demo --run mcp_demo_ci
      - name: Fake-model agent demonstration through actual stdio MCP
        run: uv run --locked opsdesk-agent demo --case multi_step
      - name: Objective scripted development evaluation (no paid API)
        run: uv run --locked opsdesk-eval run --development --config benchmarks/evaluation/development.json
      - name: Paired fault, attack and benign control smoke (no paid API)
        run: uv run --locked opsdesk-eval run --suite all --paired --transport memory
      - name: Validate Compose configuration without rendering credentials
        env:
          POSTGRES_PASSWORD: unused-config-validation-only
        run: docker compose --env-file .env.example config --quiet
      - name: Package and stack import smoke check
        run: |
          uv run --locked python -c "import agent_reliability_lab, fastapi, langgraph, mcp, psycopg, streamlit"
          uv build
      - name: Install built wheel with locked dependencies in an isolated environment
        run: |
          uv venv --python python .local/ci-wheel
          uv export --locked --no-dev --no-emit-project --no-hashes --output-file .local/runtime.txt > /dev/null
          uv pip install --python .local/ci-wheel/bin/python -r .local/runtime.txt dist/*.whl
          WHEEL_PYTHON="$PWD/.local/ci-wheel/bin/python"
          pushd "$RUNNER_TEMP"
          "$WHEEL_PYTHON" -I -c "import importlib.metadata as m; import agent_reliability_lab as p; import agent_reliability_lab.agent, agent_reliability_lab.mcp, agent_reliability_lab.evaluation, agent_reliability_lab.research; assert p.__version__ == m.version('agent-reliability-lab'); assert 'site-packages' in p.__file__; print(p.__version__, p.__file__)"
          popd
